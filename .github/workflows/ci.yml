name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MAGE_VERSION: v1.17.2

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mage
        run: |
          go install github.com/magefile/mage@${{ env.MAGE_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: mage lint

      - name: Build
        run: mage build

      - name: Test
        run: mage test
